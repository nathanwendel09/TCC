<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanceNews</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Inter", sans-serif;
        }

        :root{
            --bg:#F5F7F4;
            --text: #18372C;
            --header: #18372C;
            --card: #224638;
            --green: #4FA37B;
            --white: #fff;
            --footer: #18372C;
            --error: #ff4d4d;
        }

        body{
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        header{
            background: var(--header);
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo{
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--green);
            font-size: 28px;
            font-weight: bold;
        }

        .logo img{
            width: 90px;
            height: 80px;
            object-fit: contain;
        }

        nav ul{
            list-style: none;
            display: flex;
            gap: 20px;
        }

        nav a{
            color:white;
            text-decoration: none;
            transition: .3s;
        }

        nav a:hover{
            color: var(--green);
        }

        .btn{
            background: var(--green);
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        /* AUTH SECTION */
        .auth-wrapper{
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 8%;
        }

        .auth-card{
            background: var(--white);
            width: 100%;
            max-width: 420px;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        .auth-tabs{
            display: flex;
            gap: 10px;
            margin-bottom: 28px;
        }

        .tab-btn{
            flex: 1;
            background: none;
            border: none;
            padding: 12px;
            font-weight: bold;
            font-size: 15px;
            color: var(--text);
            opacity: .5;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: .2s;
        }

        .tab-btn.active{
            opacity: 1;
            color: var(--green);
            border-bottom: 3px solid var(--green);
        }

        .auth-form{
            display: none;
            flex-direction: column;
            gap: 6px;
        }

        .auth-form.active{
            display: flex;
        }

        .auth-form label{
            font-size: 13px;
            font-weight: 600;
            margin-top: 10px;
        }

        .auth-form input{
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
        }

        .auth-form input:focus{
            outline: none;
            border-color: var(--green);
        }

        .password-field{
            position: relative;
        }

        .password-field input{
            padding-right: 42px;
        }

        .toggle-senha{
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
            padding: 4px;
        }

        .auth-submit{
            margin-top: 20px;
            width: 100%;
        }

        .form-error{
            color: var(--error);
            font-size: 13px;
            min-height: 18px;
        }

        /* FOOTER */
        footer{
            background: var(--footer);
            color: white;
            text-align: center;
            padding: 30px;
        }

        .social-section{
            margin-top: 25px;
        }

        .social-section p{
            color: #bbb;
        }

        .social{
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .social img{
            width: 40px;
            height: 40px;
            object-fit: contain;
            transition: .3s;
        }

        .social img:hover{
            transform: scale(1.2);
        }

        @media (max-width: 768px) {
            nav {
                display: none;
            }

            .auth-card{
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">
            <img src="frontend/pages/CSS/assets/img/logo_2.png" alt="Logo FinanceNews">
            <span>FinanceNews</span>
        </div>

        <nav>
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="indicacoes.html">Indicações</a></li>
                <li><a href="investimentos.html">Investimentos</a></li>
                <li><a href="#">Economia</a></li>
                <li><a href="#">Notícias</a></li>
            </ul>
        </nav>
    </header>

    <!-- LOGIN / CADASTRO -->
    <section class="auth-wrapper">

        <div class="auth-card">

            <div class="auth-tabs">
                <button class="tab-btn active" id="tab-login" type="button">Entrar</button>
                <button class="tab-btn" id="tab-cadastro" type="button">Criar conta</button>
            </div>

            <!-- FORM LOGIN -->
            <form id="form-login" class="auth-form active">

                <label for="login-email">E-mail</label>
                <input type="email" id="login-email" name="email" placeholder="seuemail@exemplo.com" required>

                <label for="login-senha">Senha</label>
                <div class="password-field">
                    <input type="password" id="login-senha" name="senha" placeholder="Sua senha" required>
                    <button type="button" class="toggle-senha" data-target="login-senha">👁️</button>
                </div>

                <p class="form-error" id="login-error"></p>

                <button type="submit" class="btn auth-submit">Entrar</button>
            </form>

            <!-- FORM CADASTRO -->
            <form id="form-cadastro" class="auth-form">

                <label for="cad-nome">Nome</label>
                <input type="text" id="cad-nome" name="nome" placeholder="Seu nome completo" required>

                <label for="cad-email">E-mail</label>
                <input type="email" id="cad-email" name="email" placeholder="seuemail@exemplo.com" required>

                <label for="cad-senha">Senha</label>
                <div class="password-field">
                    <input type="password" id="cad-senha" name="senha" placeholder="Crie uma senha" required minlength="6">
                    <button type="button" class="toggle-senha" data-target="cad-senha">👁️</button>
                </div>

                <label for="cad-confirmar">Confirmar senha</label>
                <div class="password-field">
                    <input type="password" id="cad-confirmar" name="confirmar_senha" placeholder="Repita a senha" required minlength="6">
                    <button type="button" class="toggle-senha" data-target="cad-confirmar">👁️</button>
                </div>

                <p class="form-error" id="cadastro-error"></p>

                <button type="submit" class="btn auth-submit">Criar conta</button>
            </form>

        </div>

    </section>

    <!-- FOOTER -->
    <footer>
        <h2>FinanceNews</h2>

        <div class="social-section">
            <h3>Conheça nossas redes sociais</h3>
            <p>Acompanhe conteúdos exclusivos</p>

            <div class="social">
                <a href="https://instagram.com/finnancesnc" target="_blank">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" alt="Instagram">
                </a>
            </div>
        </div>

        <p>© 2026 Todos os direitos reservados.</p>
    </footer>

    <script>
        const tabLogin = document.getElementById("tab-login");
        const tabCadastro = document.getElementById("tab-cadastro");
        const formLogin = document.getElementById("form-login");
        const formCadastro = document.getElementById("form-cadastro");

        tabLogin.addEventListener("click", () => {
            tabLogin.classList.add("active");
            tabCadastro.classList.remove("active");
            formLogin.classList.add("active");
            formCadastro.classList.remove("active");
        });

        tabCadastro.addEventListener("click", () => {
            tabCadastro.classList.add("active");
            tabLogin.classList.remove("active");
            formCadastro.classList.add("active");
            formLogin.classList.remove("active");
        });

        document.querySelectorAll(".toggle-senha").forEach((botao) => {
            botao.addEventListener("click", () => {
                const input = document.getElementById(botao.dataset.target);
                const mostrando = input.type === "text";
                input.type = mostrando ? "password" : "text";
                botao.textContent = mostrando ? "👁️" : "🙈";
            });
        });

        formLogin.addEventListener("submit", async (e) => {
            e.preventDefault();
            const errorEl = document.getElementById("login-error");
            errorEl.textContent = "";

            const email = document.getElementById("login-email").value.trim();
            const senha = document.getElementById("login-senha").value;

            if (!email || !senha) {
                errorEl.textContent = "Preencha e-mail e senha.";
                return;
            }

            // TODO: quando o backend/MySQL estiver pronto, trocar por fetch("backend/api/login.php", ...)
            console.log("Login (simulado, sem backend ainda):", { email, senha });
            errorEl.style.color = "var(--green)";
            errorEl.textContent = "Backend ainda não conectado — login simulado no console.";
        });

        formCadastro.addEventListener("submit", async (e) => {
            e.preventDefault();
            const errorEl = document.getElementById("cadastro-error");
            errorEl.textContent = "";

            const nome = document.getElementById("cad-nome").value.trim();
            const email = document.getElementById("cad-email").value.trim();
            const senha = document.getElementById("cad-senha").value;
            const confirmar = document.getElementById("cad-confirmar").value;

            if (!nome || !email || !senha || !confirmar) {
                errorEl.textContent = "Preencha todos os campos.";
                return;
            }

            if (senha.length < 6) {
                errorEl.textContent = "A senha precisa ter pelo menos 6 caracteres.";
                return;
            }

            if (senha !== confirmar) {
                errorEl.textContent = "As senhas não coincidem.";
                return;
            }

            // TODO: quando o backend/MySQL estiver pronto, trocar por fetch("backend/api/cadastro.php", ...)
            console.log("Cadastro (simulado, sem backend ainda):", { nome, email, senha });
            errorEl.style.color = "var(--green)";
            errorEl.textContent = "Backend ainda não conectado — cadastro simulado no console.";
        });
    </script>

</body>
</html>
